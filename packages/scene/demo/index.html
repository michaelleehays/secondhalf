<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Scene demo</title>
    <style>
      :root { color-scheme: dark; font: 14px system-ui, sans-serif; }
      html, body { margin: 0; height: 100%; background: #0b0d10; color: #f1efea; overflow: hidden; }
      #scene { position: absolute; inset: 0; }
      #panel { position: absolute; left: 12px; top: 12px; max-width: min(340px, calc(100% - 24px)); max-height: calc(100% - 24px); overflow: auto;
        background: rgba(20, 22, 26, 0.88); border: 1px solid #2c3037; border-radius: 12px; padding: 10px 12px; }
      #panel[open] { display: flex; flex-direction: column; gap: 8px; }
      #panel summary { cursor: pointer; }
      #panel h1 { display: inline; font-size: 13px; margin: 0; letter-spacing: 0.04em; text-transform: uppercase; color: #9a9ca3; }
      .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
      button { font: inherit; color: inherit; background: #1e2126; border: 1px solid #2c3037; border-radius: 8px; padding: 5px 9px; cursor: pointer; }
      button:hover { border-color: #ff6a2b; }
      label { display: grid; grid-template-columns: 70px 1fr 32px; gap: 6px; align-items: center; }
      #log { font: 12px ui-monospace, monospace; color: #9a9ca3; min-height: 1.4em; }
    </style>
  </head>
  <body>
    <div id="scene"></div>
    <div id="sheet" style="display:none;position:absolute;background:rgba(21,23,26,0.92);border-left:1px solid #2c3037;border-top:1px solid #2c3037;pointer-events:none"></div>
    <details id="panel" open>
      <summary><h1>Scene demo · sample player</h1></summary>
      <label>Health <input id="health" type="range" min="0" max="100" /><span id="healthV"></span></label>
      <label>Strength <input id="strength" type="range" min="0" max="100" /><span id="strengthV"></span></label>
      <div class="row" id="events"></div>
      <div class="row" id="views"></div>
      <div class="row" id="trail"></div>
      <div class="row" id="sheets"></div>
      <div id="log">Tap the mountain or the athlete.</div>
    </details>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
